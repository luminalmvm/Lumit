<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Lumit, the motion graphics and compositing editor, in your browser. Everything stays on your computer.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0d0f13">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="manifest" href="manifest.json">
  <title>Lumit</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0d0f13; }
    #lumit-no-webgpu {
      display: none; box-sizing: border-box; height: 100%; padding: 32px;
      align-items: center; justify-content: center; text-align: center;
      color: #c9cdd6; font: 15px/1.5 system-ui, sans-serif;
    }
    #lumit-no-webgpu p { max-width: 28em; margin: 0; }
  </style>
</head>
<body>
  <div id="lumit-no-webgpu">
    <p>Lumit needs WebGPU, and this browser doesn't have it. Try a recent Chrome, Edge, Firefox or Safari.</p>
  </div>
  <script src="flutter_bootstrap.js" async></script>

</html>
