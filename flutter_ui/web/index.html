<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Lumit, the motion graphics and compositing editor, in your browser. Everything stays on your computer.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0d0f13">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="manifest" href="manifest.json">
  <title>Lumit</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0d0f13; }
    #lumit-no-webgpu {
      display: none; box-sizing: border-box; height: 100%; padding: 32px;
      align-items: center; justify-content: center; text-align: center;
      color: #c9cdd6; font: 15px/1.5 system-ui, sans-serif;
    }
    #lumit-no-webgpu p { max-width: 28em; margin: 0; }
    /* What shows while Lumit downloads, gone with Flutter's first frame. */
    #lumit-loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      background: #0d0f13; z-index: 1;
      transition: opacity 200ms cubic-bezier(0.23, 1, 0.32, 1);
    }
    #lumit-loading img { height: 22px; }
    #lumit-loading .track {
      width: 120px; height: 2px; border-radius: 1px; overflow: hidden;
      background: #1c1f26;
    }
    #lumit-loading .track::after {
      content: ''; display: block; width: 40%; height: 100%;
      background: #6fdca8; animation: lumit-slide 1.1s linear infinite;
    }
    @keyframes lumit-slide {
      from { transform: translateX(-100%); }
      to { transform: translateX(250%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #lumit-loading .track::after { animation: none; width: 100%; opacity: 0.4; }
    }
    #lumit-loading.gone { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="lumit-loading" aria-label="Loading Lumit">
    <img src="assets/assets/brand/lumit-wordmark.svg" alt="Lumit">
    <div class="track"></div>
  </div>
  <div id="lumit-no-webgpu">
    <p>Lumit needs WebGPU, and this browser doesn't have it. Try a recent Chrome, Edge, Firefox or Safari.</p>
  </div>
  <script src="files.js"></script>
  <script type="module" src="media.js"></script>
  <script type="module" src="sound.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
