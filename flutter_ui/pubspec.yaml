name: lumit_flutter
description: "Lumit's Flutter frontend (K-174); see docs/archive/flutter-port/."
publish_to: 'none'
version: 0.3.0+1

environment: 
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  crypto: ^3.0.7
  ffi: ^2.1.0
  # Draws Lumit's own glyphs, which are inline SVG (docs/15-DESIGN.md §5).
  flutter_svg: ^2.3.0
  file_selector: ^1.1.0
  # Files dropped on the window from the OS file manager (K-581). Flutter 3.47
  # has no drop API of its own — neither the framework nor the Windows
  # embedder — so this is the smallest maintained way to hear the event: one
  # method channel per platform, no native drag *sources*, no Rust toolchain.
  desktop_drop: ^0.8.0
  lumit_bridge:
    path: rust_builder
  flutter_rust_bridge: 2.12.0
  provider: ^6.1.5+1
  freezed_annotation: ^3.1.0
  uuid: ^4.6.0
  syntax_highlight: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^3.2.5
  build_runner: ^2.15.1
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # Turns lib/l10n/*.arb into Dart at `flutter pub get` time (see l10n.yaml).
  generate: true
  assets:
    # The brand's own drawings — the wordmark on the welcome screen (K-480).
    # The site's file, copied rather than redrawn (shell/wordmark.dart).
    - assets/brand/
  fonts:
    # The two redesign faces (docs/15-DESIGN.md §7.1, K-438): Hanken Grotesk
    # for UI text, Geist Mono for every number, timecode and container label.
    - family: Hanken Grotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk-Regular.otf
          weight: 400
        - asset: assets/fonts/HankenGrotesk-Medium.otf
          weight: 500
    - family: Geist Mono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.otf
          weight: 400
        - asset: assets/fonts/GeistMono-Medium.otf
          weight: 500
    # Inter is on its way out; panels still name it until the panels phase.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
          weight: 400
        - asset: assets/fonts/Inter-Medium.otf
          weight: 500
