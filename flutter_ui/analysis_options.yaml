include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Vendored third-party build tooling (cargokit, shipped with
    # flutter_rust_bridge) with its own pubspec and its own
    # analysis_options.yaml. Its dependencies — `github`, `ed25519_edwards` —
    # are deliberately not in this app's pubspec, since only its
    # precompile-binaries path needs them and we do not use that path. Analysing
    # it from here therefore reports ~20 unresolved-import errors for code we
    # neither wrote nor build.
    - rust_builder/cargokit/**
    # flutter_rust_bridge's generated bindings, regenerated by
    # `flutter_rust_bridge_codegen` whenever crates/lumit-bridge/src/api changes.
    # Hand-fixing a lint here would be undone by the next generation.
    - lib/src/rust/**
