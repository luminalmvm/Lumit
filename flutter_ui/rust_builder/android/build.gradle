// The Android Gradle Plugin builds the native code with the Android NDK.

group 'com.flutter_rust_bridge.rust_lib_lumit_flutter'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // The Android Gradle Plugin knows how to build native code with the NDK.
        classpath 'com.android.tools.build:gradle:7.3.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.flutter_rust_bridge.rust_lib_lumit_flutter'
    }

    // Bumping the plugin compileSdkVersion requires all clients of this plugin
    // to bump the version in their app.
    compileSdkVersion 33

    // Use the NDK version
    // declared in /android/app/build.gradle file of the Flutter project.
    // Replace it with a version number if this plugin requires a specfic NDK version.
    // (e.g. ndkVersion "23.1.7779620")
    ndkVersion android.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 19
    }
}

apply from: "../cargokit/gradle/plugin.gradle"
cargokit {
    // Relative to this file. The frb template's `../../rust` assumes the crate
    // sits in a `rust/` folder beside `rust_builder/`; ours is a workspace member
    // at `crates/lumit-bridge`, and `libname` must match the cdylib the crate
    // actually produces (see rust_builder/windows/CMakeLists.txt for the same
    // correction, and its note on why the Windows path differs). Untested —
    // Android is not a target yet (docs/16-ROADMAP.md), but leaving a value that
    // is known to be wrong is worse than fixing it blind.
    manifestDir = "../../../crates/lumit-bridge"
    libname = "lumit_bridge"
}
