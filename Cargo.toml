[workspace]
resolver = "3"
members = ["crates/lumit-*"]

[workspace.package]
version = "0.11.1"
edition = "2021"
license = "GPL-3.0-only"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# 14-ENGINEERING-RULES §4: an unfinished branch must not ship. (The broader
# indexing_slicing / arithmetic_side_effects denies from §4 are not on yet —
# they need a sweep of the existing hot paths first.)
todo = "deny"
unimplemented = "deny"

[workspace.lints.rust]
unsafe_code = "deny"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# The engine's maths crates run fully optimised even in a dev build. The
# Flutter debug app builds the Rust side under the dev profile (cargokit maps
# Flutter debug to cargo dev), and at opt-level 1 the Lens flare's CPU bake
# measured ~16x slower — a one-second lens change became twenty-three. These
# four crates are where every hot loop lives; the compile-time cost is theirs
# alone, and stepping through engine internals in a debugger is not how this
# project is worked on (the tests are).
[profile.dev.package.lumit-core]
opt-level = 3

[profile.dev.package.lumit-eval]
opt-level = 3

[profile.dev.package.lumit-gpu]
opt-level = 3

[profile.dev.package.lumit-render]
opt-level = 3

# Motion measurement is in the frame path once Denoise is on a layer: its
# luma, confidence and chaining run on the processor for every new frame. At
# opt-level 1 a debug app played a Denoise at one frame a second where a
# release build plays it at about thirty.
[profile.dev.package.lumit-flow]
opt-level = 3

# The browser build (scripts/build-web.ps1). One codegen unit and full LTO make
# the engine's wasm much smaller, and the page downloads every byte of it.
[profile.web]
inherits = "release"
lto = true
codegen-units = 1
debug = false
strip = true

# The browser build is sized for Cloudflare's 25 MiB a file. Dependencies and
# the crates around the engine build small, while the maths crates and the
# dependencies a frame leans on (text shaping, paths, expressions) stay fast.
[profile.web.package."*"]
opt-level = "s"

[profile.web.package.lumit_bridge]
opt-level = "s"

[profile.web.package.lumit-share]
opt-level = "s"

[profile.web.package.lumit-script]
opt-level = "s"

[profile.web.package.lumit-import]
opt-level = "s"

[profile.web.package.lumit-keymap]
opt-level = "s"

[profile.web.package.lumit-project]
opt-level = "s"

[profile.web.package.lumit-ml]
opt-level = "s"

[profile.web.package.lumit-extensions]
opt-level = "s"

[profile.web.package.lumit-ingress]
opt-level = "s"

[profile.web.package.lumit-text]
opt-level = "s"

[profile.web.package.lumit-peer]
opt-level = "s"

[profile.web.package.rhai]
opt-level = 3

[profile.web.package.harfrust]
opt-level = 3

[profile.web.package.hashbrown]
opt-level = 3

[profile.web.package.i_overlay]
opt-level = 3

[profile.web.package.zeno]
opt-level = 3

[profile.web.package.read-fonts]
opt-level = 3

[profile.web.package.skrifa]
opt-level = 3

[profile.web.package.spade]
opt-level = 3

[profile.web.package.half]
opt-level = 3
