# Release pipeline: push a tag like v0.1.0 and this builds all
# three platform artefacts on GitHub's own runners and attaches them to a
# GitHub Release — no local cross-building, which Flutter cannot do anyway.
#
# Three things are *installed*: a Windows setup .exe, a macOS .dmg and a
# Linux .flatpak — one per platform, and the Linux tarball is withdrawn. Beside
# them ride the plain application archives the in-place updater fetches:
# a Windows .zip and a macOS .zip, which are not installers and are not offered
# as a way to install. Every job gates the release; nothing is
# continue-on-error, so a partial release is never published quietly.
#
# Toolchain steps mirror ci.yml's `windows` and `flutter-linux` jobs exactly
# (same FFmpeg 8.1 shared build, same LLVM 18 pin, same Flutter 3.47.1); when
# one changes, change the other.
#
# The macOS artefacts are Developer ID signed, notarised and stapled
# when the six signing secrets are present; without them make-dmg.sh falls back
# to the ad-hoc signature it always used, so forks and a secretless repository
# still build. The Windows installer is unsigned either way — that waits on a
# code-signing certificate, which is a purchase and not code.

name: release

on:
  push:
    tags: ["v*"]
  # A rehearsal: build all three artefacts without publishing anything. The
  # version cannot come from a branch name, so it is typed in, and the publish
  # and announce jobs below run for a tag only - a manual run leaves the
  # installers as run artefacts and creates no release.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, with or without the leading v"
        required: true

# Only the publish job writes to the repository, so only it gets a token
# that can.
permissions:
  contents: read

env:
  # A tag run takes its version from the tag; a manual run from the input. The
  # leading v is stripped where the version is used, as it always was.
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    env:
      FFMPEG_ASSET: ffmpeg-n8.1.2-50-g1a748fe2cd-win64-gpl-shared-8.1
      FFMPEG_SHA256: 0a41f31caff48e3035b48f09f5d840bd8d1863008240fc43e457f15e589cf5b3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
      - name: Install FFmpeg 8.1 (BtbN shared build)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-31-13-27/$env:FFMPEG_ASSET.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\ffmpeg.zip"
          # The archive must match the hash pinned beside its name above.
          $hash = (Get-FileHash "$env:RUNNER_TEMP\ffmpeg.zip" -Algorithm SHA256).Hash
          if ($hash -ne $env:FFMPEG_SHA256) { throw "FFmpeg archive hash $hash is not the pinned $env:FFMPEG_SHA256" }
          Expand-Archive "$env:RUNNER_TEMP\ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP\ffmpeg"
          $root = (Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Directory | Select-Object -First 1).FullName
          "FFMPEG_LIBS_DIR=$root\lib"        >> $env:GITHUB_ENV
          "FFMPEG_INCLUDE_DIR=$root\include" >> $env:GITHUB_ENV
          "$root\bin" >> $env:GITHUB_PATH
      - name: Install LLVM 18 (libclang for bindgen)
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: "18.1.8"
          directory: ${{ runner.temp }}/llvm
      - name: Point bindgen at libclang
        shell: pwsh
        run: |
          "LIBCLANG_PATH=$env:RUNNER_TEMP\llvm\bin" >> $env:GITHUB_ENV
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build the installer
        shell: pwsh
        run: |
          $version = "$env:RELEASE_VERSION".TrimStart('v')
          & packaging/windows/build-installer.ps1 -Version $version
      # The same files the installer lays down, as a plain archive.
      # This is what a per-user installation fetches to update itself: no
      # installer to run, no elevation, no questions already answered once.
      - name: Package the app for in-place updates
        shell: pwsh
        run: |
          $version = "$env:RELEASE_VERSION".TrimStart('v')
          $stage = "$env:RUNNER_TEMP\lumit-package"
          New-Item -ItemType Directory -Force -Path "$stage\icons" | Out-Null
          Copy-Item -Recurse -Force flutter_ui\build\windows\x64\runner\Release\* $stage
          Copy-Item assets\brand\lumit-project.ico, assets\brand\lumit-preset.ico "$stage\icons"
          Compress-Archive -Path "$stage\*" -Force `
            -DestinationPath "packaging/windows/dist/lumit-$version-windows-x64.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installer
          path: |
            packaging/windows/dist/*.exe
            packaging/windows/dist/*.zip
          if-no-files-found: error

  linux-bundle:
    name: Linux bundle
    runs-on: ubuntu-latest
    env:
      FFMPEG_ASSET: ffmpeg-n8.1.2-50-g1a748fe2cd-linux64-gpl-shared-8.1
      FFMPEG_SHA256: 35dc428bf78d3f8a4447a68707338ecf9560ebcc7459967974f9ff5b1f84be24
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
      - name: Install desktop + Flutter build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libgl-dev libegl-dev libgles-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxcb1-dev \
            libwayland-dev mesa-vulkan-drivers libclang-18-dev \
            clang cmake ninja-build libgtk-3-dev
      - name: Install FFmpeg 8.1 (BtbN shared build)
        run: |
          url="https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-31-13-27/${FFMPEG_ASSET}.tar.xz"
          curl -fsSL "$url" -o "$RUNNER_TEMP/ffmpeg.tar.xz"
          # Checked against the hash pinned beside the asset name above.
          echo "$FFMPEG_SHA256  $RUNNER_TEMP/ffmpeg.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP/ffmpeg" --strip-components=1
          root="$RUNNER_TEMP/ffmpeg"
          sed -i "s|^prefix=.*|prefix=$root|" "$root"/lib/pkgconfig/*.pc
          echo "PKG_CONFIG_PATH=$root/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$root/lib" >> "$GITHUB_ENV"
          echo "FFMPEG_ROOT=$root" >> "$GITHUB_ENV"
          echo "$root/bin" >> "$GITHUB_PATH"
      - name: Point bindgen at libclang
        run: echo "LIBCLANG_PATH=/usr/lib/llvm-18/lib" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - name: flutter build linux
        working-directory: flutter_ui
        run: |
          flutter pub get
          flutter build linux --release
      - name: Stage the bundle
        run: |
          version="${RELEASE_VERSION#v}"
          stage="lumit-$version-linux-x64"
          cp -r flutter_ui/build/linux/x64/release/bundle "$stage"
          # The bridge links FFmpeg's shared build; the launcher's rpath already
          # covers lib/, so the .so files ride along there.
          cp -a "$FFMPEG_ROOT"/lib/*.so* "$stage/lib/"
          # The vendored ACES bakes are read at runtime from data/colour beside
          # the launcher (crates/lumit-colour/src/builtin.rs) rather than
          # compiled into the binary. The Flatpak repacks this stage wholesale,
          # so one copy covers both artefacts.
          mkdir -p "$stage/data/colour"
          cp crates/lumit-colour/vendored/*.artefact "$stage/data/colour/"
          # Desktop entry, MIME types and icons for a by-hand install.
          mkdir -p "$stage/share"
          cp packaging/linux/io.github.luminalmvm.Lumit.desktop \
             packaging/linux/lumit-mime.xml "$stage/share/"
          cp assets/brand/lumit-mark.svg assets/brand/lumit-project.svg \
             assets/brand/lumit-preset.svg assets/brand/lumit-theme.svg \
             "$stage/share/"
      - name: Build the Flatpak
        # Repacks the staged bundle (FFmpeg libs included) via the manifest in
        # packaging/flatpak/ into a single-file .flatpak anyone can install
        # with `flatpak install lumit-*.flatpak`. This is the whole Linux
        # release, so a failure here fails the release rather than
        # publishing a Linux-shaped hole.
        run: |
          version="${RELEASE_VERSION#v}"
          stage="lumit-$version-linux-x64"
          # Two packages flatpak-builder needs but does not depend on, both of
          # which --no-install-recommends would otherwise drop:
          #   elfutils         supplies eu-strip, which flatpak-builder shells
          #                    out to when splitting debug symbols out of the
          #                    binaries; without it the build dies at the first
          #                    .so it tries to strip.
          #   librsvg2-common  supplies the gdk-pixbuf SVG loader. The app icon
          #                    ships as scalable SVG only, and `appstreamcli
          #                    compose` reads icons through gdk-pixbuf, so
          #                    without the loader it cannot read the icon
          #                    (file-read-error), emits no component at all
          #                    (filters-but-no-output) and fails the build.
          #                    librsvg2-2 alone is not enough — that is the
          #                    library, not the loader plugin.
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder elfutils librsvg2-common
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.gnome.Platform//49 org.gnome.Sdk//49
          cp -r "$stage" packaging/flatpak/bundle
          sed -i "s|version=\"[0-9.]*\" date=\"[0-9-]*\"|version=\"$version\" date=\"$(date -u +%F)\"|" \
            packaging/flatpak/io.github.luminalmvm.Lumit.metainfo.xml
          flatpak-builder --user --force-clean --repo=flatpak-repo \
            flatpak-build packaging/flatpak/io.github.luminalmvm.Lumit.yml
          flatpak build-bundle flatpak-repo \
            "lumit-$version-linux-x64.flatpak" io.github.luminalmvm.Lumit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-bundle
          path: lumit-*-linux-x64.flatpak
          if-no-files-found: error

  macos-dmg:
    name: macOS disk image
    runs-on: macos-latest
    env:
      # A step's `if` cannot read the `secrets` context, only `env`, so the
      # signing gate below tests these. Absent secrets leave them empty and
      # make-dmg.sh signs ad hoc exactly as it did before signing arrived.
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
      # Mirrors ci.yml's macOS jobs: FFmpeg 8.1.2 from a formula extracted out
      # of homebrew-core's history, built once and cached, with the major
      # asserted before anything links against it. The action exports
      # FFMPEG_PKG_CONFIG_PATH and creates the opt prefix make-dmg.sh
      # probes for.
      - name: FFmpeg 8.1.2 (extracted formula, cached keg)
        uses: ./.github/actions/ffmpeg8-macos
      - name: Install the packaging tools
        run: brew install dylibbundler create-dmg
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      # The app icon is an Icon Composer document: actool needs Xcode 26
      # or newer to compile it. Mirrors ci.yml's `flutter-macos` job.
      - name: Select the newest Xcode (26+ for the .icon)
        run: |
          latest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$latest"
          ver="$(xcodebuild -version | head -1 | awk '{print $2}')"
          echo "Using Xcode $ver ($latest)"
          [ "${ver%%.*}" -ge 26 ] || {
            echo "::error::Xcode $ver cannot compile assets/brand/lumit-icon.icon (needs 26+)"
            exit 1
          }
      - name: Import the Developer ID certificate
        if: env.MACOS_SIGN_IDENTITY != ''
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          # The keychain is thrown away with the runner, so its password is a
          # literal rather than a seventh secret to rotate.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$keychain"
          # Default keychains re-lock after five minutes of idling, which is
          # less than a release build takes; -lut 21600 outlasts the job.
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p ci "$keychain"
          echo "$CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          # Without this, the first codesign raises a GUI password prompt that
          # nothing on a runner can answer, and the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k ci "$keychain"
          # codesign and trust evaluation both search the keychain *list*, not
          # the default keychain alone: off the list, the Developer ID
          # intermediate is invisible and the identity reads as untrusted.
          security list-keychains -d user -s "$keychain" login.keychain-db
          echo "$API_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/apple-api-key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple-api-key.p8" >> "$GITHUB_ENV"
      - name: Build the disk image
        run: |
          version="${RELEASE_VERSION#v}"
          packaging/macos/make-dmg.sh "$version"
      # The bundle on its own, for in-place updates. `ditto` rather than
      # `zip`: an .app carries symbolic links, code signatures and executable
      # bits, and an archiver that drops those produces a bundle macOS refuses
      # to open.
      - name: Package the bundle for in-place updates
        run: |
          version="${RELEASE_VERSION#v}"
          app="flutter_ui/build/macos/Build/Products/Release/Lumit.app"
          mkdir -p packaging/macos/dist
          ditto -c -k --keepParent "$app" \
            "packaging/macos/dist/lumit-$version-macos-$(uname -m).zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-dmg
          path: |
            packaging/macos/dist/*.dmg
            packaging/macos/dist/*.zip
          if-no-files-found: error

  publish:
    name: GitHub release
    needs: [windows-installer, linux-bundle, macos-dmg]
    permissions:
      contents: write
    # A manual run is a rehearsal and publishes nothing.
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          merge-multiple: true
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a suffix (v0.2.0-rc1) publishes as a pre-release, so a
          # dry run of the whole pipeline never becomes the download page's
          # "latest". Plain v0.2.0 is the real thing.
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; *) prerelease= ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Lumit $GITHUB_REF_NAME" \
            --generate-notes $prerelease

  announce:
    name: Discord announcement
    needs: publish
    # Only a plain vX.Y.Z tag is announced. A suffixed one (v0.2.0-rc1) is a
    # pre-release, and a dry run of the pipeline should not tell the community
    # a release has happened.
    if: ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    env:
      # A step's `if` cannot read the `secrets` context, only `env`. Without the
      # secret — on a fork, or before it is set — the release still succeeds and
      # simply goes unannounced.
      DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Post the release notes to Discord
        if: env.DISCORD_RELEASE_WEBHOOK != ''
        run: node scripts/discord-release.mjs "${GITHUB_REF_NAME#v}"
      - name: Say why nothing was posted
        if: env.DISCORD_RELEASE_WEBHOOK == ''
        run: echo "::warning::DISCORD_RELEASE_WEBHOOK is not set, so this release was not announced in Discord."
