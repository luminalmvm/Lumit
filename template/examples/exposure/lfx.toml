# The bundle's own listing, read before any of this bundle's code runs.
#
# It is the cheap listing and never the authority: everything here is compared
# against what the code answers once the module is open, and a disagreement
# refuses the plugin. Keeping the two in step is the whole of a vendor's
# obligation here - `lfx-validator` reads both and says which field disagreed.
abi_version = 1

[[plugin]]
id = "com.example.lfx.exposure"
name = "Exposure"
vendor = "Example"
version = "1.0.0"
# Named rather than numbered, from the closed vocabulary of eight. The first is
# the heading the effect is browsed under; the rest are search keywords.
categories = ["colour", "utility"]
required_extensions = []
