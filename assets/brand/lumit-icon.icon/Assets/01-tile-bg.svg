<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512" fill="none">
  <!-- Layer 1 (bottom): dark tile fill. Drawn as a full-bleed rect - Icon Composer
       supplies the squircle mask and the platform corner radius itself. -->
  <defs>
    <linearGradient id="tile-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16181d"/><stop offset="1" stop-color="#0d0f13"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#tile-bg)"/>
</svg>
