<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Installed as /app/etc/fonts/local.conf, which the runtime's fontconfig reads.

  Web fonts are left out. Fontconfig 2.17 lists a .woff or .woff2 file with no
  family name, and the Skia inside Flutter loops forever on a font with no
  family. Ubuntu 26.04 puts some in /usr/share/fonts/woff, and Lumit then
  hung at start with no window (#538).
-->
<fontconfig>
  <selectfont>
    <rejectfont>
      <glob>*.woff</glob>
      <glob>*.woff2</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
