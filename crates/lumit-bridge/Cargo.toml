[package]
name = "lumit_bridge"
version.workspace = true
edition = "2021"
license = "GPL-3.0-only"
# Never goes to crates.io: these crates are the application, and they
# reference each other by path (docs/05-ARCHITECTURE.md).
publish = false

# A cdylib the Flutter desktop runners load over dart:ffi, plus a staticlib for
# the platforms cargokit links statically (iOS, and Android's release builds).
# `rlib` is deliberately absent: flutter_rust_bridge's generated code is only
# ever reached through the C ABI, and cargo still builds the lib separately for
# the in-crate unit tests, so `cargo test -p lumit_bridge` keeps working.
[lib]
crate-type = ["cdylib", "staticlib"]

# Rendering is NOT a feature. lumit-render, lumit-audio and lumit-eval are
# unconditional dependencies, because the render worker is part of the API
# surface and that surface is deliberately identical whatever is enabled — the
# generated Dart has to be one shape on every platform, so the Viewer holds one
# `switch` over the publish paths rather than a per-build set of them. A bridge
# that cannot draw has no use anyway; this was `render = default` in all but
# name, and a "feature" nothing could turn off was a lie in the manifest.
#
# The `media` feature (default on) genuinely is optional: pulling lumit-media
# means linking FFmpeg, and building without it is a real configuration. Footage
# then does not probe and thumbnails are absent.
[features]
# Zero-copy is the ONLY Viewer transport (K-183): the read-back path that sent
# every pixel across the FFI boundary is deleted, so all three zero-copy features
# are default-on. Each is inert off its own platform (the D3D interop is
# `cfg(windows)`-gated, the Vulkan/DMA-BUF interop `cfg(target_os = "linux")`,
# the Metal/IOSurface interop `cfg(target_os = "macos")`), so one default set
# still builds everywhere.
default = [
    "media",
    "shared-texture",
    "shared-texture-linux",
    "shared-texture-macos",
]
media = ["dep:lumit-media"]
# The Windows zero-copy Viewer path (K-177): a shared D3D12 texture the Flutter
# runner imports directly. Forwards to lumit-render's own feature, which pins
# the D3D12 backend and pulls the shared-texture GPU code.
shared-texture = ["lumit-render/shared-texture"]
# The Linux zero-copy Viewer path (K-177), the DMA-BUF sibling.
shared-texture-linux = ["lumit-render/shared-texture-linux"]
# The macOS zero-copy Viewer path (K-195), the Metal/IOSurface sibling: the
# runner wraps the surface in a CVPixelBuffer and shows it.
shared-texture-macos = ["lumit-render/shared-texture-macos"]

[dependencies]
lumit-core = { path = "../lumit-core" }
# Reading an After Effects bundle and mapping it to a Document (docs/11 §2,
# docs/impl/ae-import.md phase 3). An engine crate depending on lumit-core
# alone, so the docs/05 layering is unbroken.
lumit-import = { path = "../lumit-import" }
lumit-keymap = { path = "../lumit-keymap" }
lumit-project = { path = "../lumit-project" }
# The realtime preview-tier controller (K-030/K-171) lives here as a pure,
# tested decision core; the bridge feeds it measured render costs and reads the
# tier back (see src/realtime.rs). An engine crate, so the docs/05 layering
# (engine crates never depend on the UI) is unbroken.
lumit-eval = { path = "../lumit-eval" }
lumit-media = { path = "../lumit-media", optional = true }
# Beat detection maths (docs/09 §5); the audio mixdown rides the same
# headless input path lumit-render provides.
lumit-audio = { path = "../lumit-audio" }
# The pixel pass (K-178): the headless renderer, the decode worker, the draw
# builder and the compositor the Viewer and export both drive. An engine crate,
# so the bridge depends on no frontend.
lumit-render = { path = "../lumit-render" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
flutter_rust_bridge = { version = "=2.12.0", features = ["uuid"] }

# What the machine has, for the cache budgets that spend it (K-194):
# `GlobalMemoryStatusEx` for installed RAM and the first DXGI adapter's
# dedicated video memory. Pinned to the 0.58 lumit-gpu's shared-texture path
# already links, so the workspace resolves one copy rather than two.
[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
default-features = false
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_SystemInformation",
    # `GetProcessMemoryInfo` and its counters struct, for what this process is
    # actually holding (`resident_memory_bytes`), plus `GetCurrentProcess` for
    # the pseudo-handle it takes. Threading is named here rather than left to
    # feature unification: wgpu-hal happens to enable it in this workspace's
    # build, so the import compiled while the feature was unlisted — which is
    # coverage by accident, and would vanish the day that dependency changed.
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    # `GetCursorPos`/`SetCursorPos`, for the camera tools' pointer lock (K-230).
    "Win32_UI_WindowsAndMessaging",
    # `timeBeginPeriod`, so the worker's present-pacing sleeps are 1 ms-grained
    # rather than the ~15.6 ms default tick (see `raise_timer_resolution`).
    "Win32_Media",
]

[dev-dependencies]
tempfile = "3"
# The ffmpeg-made fixtures, so tests that need real media can have some —
# a still and a running clip are the two sides of the K-246 wrap rule, and
# nothing but real media can tell them apart. Skips itself with no ffmpeg.
lumit-media = { path = "../lumit-media", features = ["test-fixtures"] }

# The bridge is the one crate that cannot inherit the workspace's
# `unsafe_code = "deny"`: flutter_rust_bridge's generated glue crosses a C ABI
# over raw pointers, which is unsafe by construction. The clippy denies from the
# workspace are kept, so no-panic/no-unwrap discipline still holds here.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[lints.rust]
unsafe_code = "allow"

unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
