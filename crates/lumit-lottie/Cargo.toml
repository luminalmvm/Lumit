[package]
name = "lumit-lottie"
version.workspace = true
edition = "2021"
license = "GPL-3.0-only"
# Never goes to crates.io: these crates are the application, and they
# reference each other by path (docs/05-ARCHITECTURE.md).
publish = false

[dependencies]
lumit-core = { path = "../lumit-core" }
lumit-text = { path = "../lumit-text" }
lumit-import = { path = "../lumit-import" }
lumit-ingress = { path = "../lumit-ingress" }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[lints]
workspace = true
