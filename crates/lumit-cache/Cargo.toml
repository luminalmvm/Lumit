[package]
name = "lumit-cache"
version.workspace = true
edition = "2021"
license = "GPL-3.0-only"
# Never goes to crates.io: these crates are the application, and they
# reference each other by path (docs/05-ARCHITECTURE.md).
publish = false

[dependencies]
# The resource governor's ledger (docs/13 §3). Every tier here is byte-budgeted
# on its own; this is how the budgets stop being private to each other.
lumit-budget = { path = "../lumit-budget" }
lz4_flex = "0.11"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
