# --- Deliberate placeholders (docs/11 §5) ----------------------------------
#
# Curves is not here: its point list is the one property After Effects' own
# scripting cannot read (K-410), so the instance takes the ordinary placeholder
# road and the report's PropertyUnreadable row says why.

[[effect]]
