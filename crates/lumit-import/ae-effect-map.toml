# The After Effects effect mapping table — docs/11-AE-IMPORT.md §5.
#
# One row per After Effects effect the importer recognises, keyed by AE's
# **match name** (the stable internal name that survives a user renaming the
# effect). A row says which Lumit built-in does the same job and which
# conversion carries its controls across; a match name with no row here takes
# the placeholder road (§6) with every parameter kept, never a guess.
#
# This file ships beside the application and is read at import time, so a match
# name that turns out to be wrong — twelve of the original sixty were, before
# the 2026-08-20 audit against a live After Effects 26.0 — can be corrected
# without rebuilding Lumit. Put an edited copy next to the executable and it is
# used in place of this one; if it cannot be read or does not parse, the copy
# built into the application is used instead, so a mistyped override never
# leaves the importer with no table at all.
#
# Fields:
#   ae             AE's match name. The key; must be unique.
#   name           AE's own name for the effect, as the import report says it.
#   lumit          The Lumit effect's match name (docs/08-EFFECTS.md).
#   conversion     Which conversion carries the controls across. Named for the
#                  Lumit effect; `crates/lumit-import/src/map/fx_colour.rs` and
#                  `fx_distort.rs` hold the arithmetic, because a unit change,
#                  an option list and a split control are code rather than data.
#                  A row naming a conversion the build does not have is ignored.
#   suggest        Instead of `lumit`/`conversion`: this effect deliberately
#                  becomes a placeholder, and the report names what does the job
#                  in Lumit (§5's "placeholder + report" rows).
#   pending_audit  The match name is the famous one but was not in the audited
#                  set (K-414). Safe to ship: a match name this table has wrong
#                  is a name nothing claims, and an unclaimed name becomes a
#                  placeholder with every parameter kept.

