# --- Third-party effects (docs/11 §5, K-655) --------------------------------
#
# The vendor's internals are the vendor's, so none of these is an equivalent.
# Each row says where the effect goes: to the vendor's own OFX build of it when
# the user has that installed (`ofx`, the plug-in IS the effect), and otherwise
# to the closest Lumit effect at its defaults (`conversion = "nearest"`), in the
# right place in the stack with the report saying what it is. Every row here is
# `pending_audit`: the After Effects match names come from the 2026-08-20 audit
# where the audited machine had the plug-in, and the OFX identifiers are read
# off the vendor's builds rather than from a sitting of our own.

[[effect]]
ae = "S_Glow"
name = "S_Glow"
lumit = "glow"
conversion = "nearest"
ofx = ["com.genarts.sapphire.Lighting.S_Glow", "com.borisfx.sapphire.Lighting.S_Glow"]
pending_audit = true

[[effect]]
ae = "S_Shake"
name = "S_Shake"
lumit = "shake"
conversion = "nearest"
ofx = ["com.genarts.sapphire.Distort.S_Shake", "com.borisfx.sapphire.Distort.S_Shake"]
pending_audit = true

[[effect]]
ae = "S_DistortChroma"
name = "S_DistortChroma"
lumit = "chromatic_aberration"
conversion = "nearest"
ofx = [
  "com.genarts.sapphire.Distort.S_DistortChroma",
  "com.borisfx.sapphire.Distort.S_DistortChroma",
]
pending_audit = true

# Sapphire's dissolve transitions (K-660). The reference project uses exactly
# one of the family — S_DissolveLuma, whose Dissolve Percent is keyframed on
# every instance — so that is the row seeded here; a sibling is one more row and
# no code, the curve being keyed off the `S_Dissolve` prefix rather than off a
# list. Lumit's nearest is Linear wipe: Completion is the same sweep, and the
# Matte row makes it a gradient wipe, which is what a luma dissolve is.
#
# The identifiers are the two rows above's own shape with the Sapphire category
# the 2026-08-20 audit records for this effect ("Sapphire Transitions") in the
# group position — evidence rather than the Lenscare rows' blank, and still
# `pending_audit`. If it is wrong it matches nothing and the row takes the
# nearest road, which is the road it takes on every machine without Sapphire.
[[effect]]
ae = "S_DissolveLuma"
name = "S_DissolveLuma"
lumit = "linear_wipe"
conversion = "nearest"
ofx = [
  "com.genarts.sapphire.Transitions.S_DissolveLuma",
  "com.borisfx.sapphire.Transitions.S_DissolveLuma",
]
pending_audit = true

# Lenscare's two defocus effects. No `ofx` line: the OFX build's identifier was
# not read off a live installation, and a guessed identifier that matched
# nothing would read as one that had been checked. Add it here — the identifier
# is the one Effects & presets shows beside the plug-in (docs/12 §2.6) — and the
# direct road opens with no rebuild.
[[effect]]
ae = "DRFL Depth Of Field"
name = "FL Depth of Field"
lumit = "dof"
conversion = "nearest"
pending_audit = true

[[effect]]
ae = "DRFL Out Of Focus"
name = "FL Out of Focus"
lumit = "dof"
conversion = "nearest"
pending_audit = true
