[package]
name = "lumit-scene"
version.workspace = true
edition = "2021"
license = "GPL-3.0-only"
publish = false

[features]
# The models built in code (src/fixtures.rs), for other crates' tests and the
# bench. Nothing shipped turns it on.
test-fixtures = []

[dependencies]
base64 = "0.22"
bevy_mikktspace = "1"
glam = "0.29"
gltf = { version = "1.4", default-features = false, features = ["utils", "names", "extensions", "KHR_lights_punctual", "KHR_materials_emissive_strength", "KHR_materials_transmission", "KHR_materials_ior", "KHR_materials_unlit", "KHR_texture_transform"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tga", "webp"] }
lumit-ingress = { path = "../lumit-ingress" }
serde_json = "1"
thiserror = "2"
ufbx = "0.11"

[lints]
workspace = true
