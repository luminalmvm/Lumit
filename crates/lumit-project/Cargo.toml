[package]
name = "lumit-project"
version.workspace = true
edition = "2021"
license = "GPL-3.0-only"
# Never goes to crates.io: these crates are the application, and they
# reference each other by path (docs/05-ARCHITECTURE.md).
publish = false

[dependencies]
blake3 = "1"
directories = "6"
lumit-core = { path = "../lumit-core" }
lumit-ingress = { path = "../lumit-ingress" }
serde = { version = "1", features = ["derive"] }
# Read numbers to the exact double they were written as: the default reader
# can land one bit off on a seventeen-digit number, so a reopened project
# would not quite match the one saved.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
# Lean: no default features, so no HTML/plotters pulled into CI.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3"

[[bench]]
name = "document_scale"
harness = false

[lints]
workspace = true
