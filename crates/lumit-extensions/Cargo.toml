[package]
name = "lumit-extensions"
version.workspace = true
edition = "2021"
license = "GPL-3.0-only"
# Never goes to crates.io: these crates are the application, and they
# reference each other by path (docs/05-ARCHITECTURE.md).
publish = false

[dependencies]
# The LFX effect an extension carries, and the engine's own check of it.
lumit-core = { path = "../lumit-core" }
# The extensions folder and the extra folders the person added.
lumit-project = { path = "../lumit-project" }
# A folder being put together is named with a number nobody else has. Already
# in the lock.
getrandom = "0.4"
# The manifest is JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# A package is a zip of the extension's folder.
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
# The check a render makes of a shader, for the Tape sample's.
lumit-gpu = { path = "../lumit-gpu" }

[lints]
workspace = true
