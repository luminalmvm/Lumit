[package]
name = "lumit-track"
version.workspace = true
edition = "2021"
license = "GPL-3.0-only"
# Never goes to crates.io: these crates are the application, and they
# reference each other by path (docs/05-ARCHITECTURE.md).
publish = false

[dependencies]
lumit-core = { path = "../lumit-core" }
# The solve is written to the `track/` sidecar and read back (K-417). Deriving
# here rather than mirroring `CameraSolve` in the crate that writes it: a mirror
# is a second definition of the same thing, and the two drift the first time a
# field is added.
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[lints]
workspace = true
