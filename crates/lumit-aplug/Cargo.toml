[package]
name = "lumit-aplug"
version.workspace = true
edition = "2021"
license = "GPL-3.0-only"
# Never goes to crates.io: these crates are the application, and they
# reference each other by path (docs/05-ARCHITECTURE.md).
publish = false

[dependencies]
# The effect declaration a described plugin becomes. An audio plugin is an
# entry in the layer's ordinary effect stack — "the stack is the rack"
# (docs/impl/audio-plugins.md §2) — so its rows are the same schema rows a
# built-in declares. The edge runs one way only: nothing in the engine depends
# on the plugin host.
lumit-core = { path = "../lumit-core" }
# The CLAP C declarations, MIT/Apache-2.0. A hand-written binding would be a
# second copy of somebody else's headers, and the headers move (1.2.2 today).
clap-sys = "0.5"
# The VST3 declarations, MIT/Apache-2.0. Steinberg's own ABI is COM-style
# vtables; these are flat `#[repr(C)]` tables of exactly that shape — the plain
# projection docs/impl/audio-plugins.md §1 asks for, arrived at by generation
# rather than by hand. No SDK source is vendored here and none is needed to
# build: the bindings ship pre-generated.
vst3 = "0.3"
# A `.clap` is a plain DLL/dylib opened at run time; libloading is the portable
# `LoadLibraryW`/`dlopen` wrapper and is already in the tree. A `.vst3` bundle's
# payload is opened the same way.
libloading = "0.8"
thiserror = "2"
# The quirks table is data, not code (docs/impl/audio-plugins.md §5), so it is a
# JSON file the crate embeds and parses. The same derives put the control
# protocol's messages on the wire (`ipc::proto`).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The control plane: length-prefixed `bincode` over a duplex local socket — a
# named pipe on Windows, a Unix socket elsewhere. Never the child's stdout:
# plugins `printf`.
bincode = "1"
interprocess = "2"
# The block plane: the shared-memory ring. `memmap2` is `CreateFileMapping` +
# `MapViewOfFile` on Windows and `mmap` on Unix.
memmap2 = "0.9"

[dev-dependencies]
# The minimal CLAP plugin the host is tested against. Declared here so a plain
# `cargo test -p lumit-aplug` builds the cdylib the tests load.
lumit-aplug-testplug = { path = "../lumit-aplug-testplug" }
tempfile = "3"

# The plugin hosts cannot inherit the workspace's `unsafe_code = "deny"`: the
# CLAP API is a C ABI of raw pointers and function tables, which is unsafe by
# construction (docs/14 §7 permits it here and requires the SAFETY comments and
# layout tests that go with it). The clippy denies from the workspace are kept,
# so no-panic/no-unwrap discipline still holds.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[lints.rust]
unsafe_code = "allow"
