[package]
name = "lumit-media"
version.workspace = true
edition = "2021"
license = "GPL-3.0-only"
# Never goes to crates.io: these crates are the application, and they
# reference each other by path (docs/05-ARCHITECTURE.md).
publish = false

[features]
# Exposes the ffmpeg-CLI test-fixture generator to downstream crates' tests.
test-fixtures = []

[dependencies]
bincode = "1"
lumit-ingress = { path = "../lumit-ingress" }
blake3 = "1"
# OpenEXR's own reader, for the one thing ffmpeg cannot do: say which channels
# a file holds, and hand back one named channel rather than the RGB it guesses
# at. ffmpeg's decoder has -layer and -part but no way to enumerate either.
exr = "1.74"
# A PDF renderer, for the layers of an Illustrator document. An `.ai` file
# keeps a PDF copy of its artwork and ffmpeg opens neither half. Pure Rust,
# no unsafe code, MIT or Apache-2.0.
hayro = "0.8"
# Inflate, for the layers a Photoshop document stores zipped.
miniz_oxide = "0.8"
rsmpeg = { version = "0.18", default-features = false, features = ["ffmpeg8", "link_system_ffmpeg"] }
serde = { version = "1", features = ["derive"] }
# A self-deleting file for the frames a one-palette GIF holds until the end.
tempfile = "3"
thiserror = "2"

# The Linux FFmpeg build reaches libva through stubs that abort the process
# when it isn't installed, so VAAPI checks it loads first.
[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"

[lints]
workspace = true
