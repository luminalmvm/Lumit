[package]
name = "lumit-media"
version.workspace = true
edition = "2021"
license = "GPL-3.0-only"
# Never goes to crates.io: these crates are the application, and they
# reference each other by path (docs/05-ARCHITECTURE.md).
publish = false

[features]
# Exposes the ffmpeg-CLI test-fixture generator to downstream crates' tests.
test-fixtures = []

[dependencies]
bincode = "1"
blake3 = "1"
rsmpeg = { version = "0.18", default-features = false, features = ["ffmpeg7_1", "link_system_ffmpeg"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
