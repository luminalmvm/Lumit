[package]
name = "lumit-bench"
version.workspace = true
edition = "2021"
license = "GPL-3.0-only"
# Never goes to crates.io: these crates are the application, and they
# reference each other by path (docs/05-ARCHITECTURE.md).
publish = false
# Two binaries live here now - the harness itself and `ofx-bench` - so a bare
# `cargo run -p lumit-bench` has to be told which one it means. It means this
# one; docs/13-PERFORMANCE-RULES.md §7.3 and the CI gate both call it that way.
default-run = "lumit-bench"

# The headless performance harness (docs/13-PERFORMANCE-RULES.md §7.3, K-389).
# A **development** crate: it builds docs/13 §1's reference comp in code and
# times the engine against it. Nothing depends on it — the shipped `.dll` is
# `lumit-bridge`, which has never heard of this crate — so it cannot reach the
# application's dependency tree. It is a workspace member (the `crates/lumit-*`
# glob), so `cargo fmt`/`clippy`/`test` see it like any other crate.
[dependencies]
lumit-core = { path = "../lumit-core" }
# The per-effect scenarios (B12-B14) time one pass rather than a whole comp, so
# they build a texture and a context themselves; `no_adapter()` is also the
# polite-skip convention the GPU oracles use.
lumit-gpu = { path = "../lumit-gpu" }
lumit-render = { path = "../lumit-render" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = "1"

[lints]
workspace = true
