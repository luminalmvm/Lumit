[package]
name = "lumit-core"
version.workspace = true
edition = "2021"
license = "GPL-3.0-only"
# Never goes to crates.io: these crates are the application, and they
# reference each other by path (docs/05-ARCHITECTURE.md).
publish = false

[dependencies]
lumit-fx-macros = { path = "../lumit-fx-macros" }
# An audio plugin's opaque state blob is bytes in a pretty-printed JSON file,
# which wants a string. Already in the lock, so this downloads nothing.
hex = "0.4"
rayon = "1"
arc-swap = "1"
parking_lot = "0.12"
rhai = { version = "1.25.1", features=["metadata", "sync"] }
# `rc`: transcripts sit behind an `Arc` in the document, so an edit's copy of
# it copies a pointer.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
i_overlay = { version = "8.1.0", default-features = false }
# Constrained Delaunay + quality refinement for the puppet mesh
# (docs/impl/puppet.md §1.3). Robust predicates and termination guarantees are
# exactly the wheel not to reinvent.
spade = "2.15"
# The puppet mesh cache key (docs/impl/puppet.md §1.4). Already in the lock.
blake3 = "1"
half = "2"
# The repair effects' transforms (Noise reduction, Reverb reduction, the hum
# finder): any size, so a frame is the same length in seconds at every rate.
# Already in the lock through lumit-audio, same version.
realfft = "3.5"

[dev-dependencies]
proptest = "1"
tempfile = "3"
serde_json = "1"

[lints]
workspace = true

# The browser build: randomness comes from the page's crypto API.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
uuid = { version = "1", features = ["js"] }
