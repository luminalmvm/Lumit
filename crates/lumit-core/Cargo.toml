[package]
name = "lumit-core"
version.workspace = true
edition = "2021"
license = "GPL-3.0-only"
# Never goes to crates.io: these crates are the application, and they
# reference each other by path (docs/05-ARCHITECTURE.md).
publish = false

[dependencies]
lumit-fx-macros = { path = "../lumit-fx-macros" }
rayon = "1"
arc-swap = "1"
parking_lot = "0.12"
rhai = { version = "1.25.1", features=["metadata", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
serde_json = "1"

[lints]
workspace = true
