[package]
name = "lumit-ofx"
version.workspace = true
edition = "2021"
license = "GPL-3.0-only"
# Never goes to crates.io: these crates are the application, and they
# reference each other by path (docs/05-ARCHITECTURE.md).
publish = false

[dependencies]
# The effect declaration a described plugin becomes: an OFX effect and a
# built-in are the same kind of thing to everything downstream (docs/12 §1), so
# the schema types come from the same place. The edge runs one way only —
# nothing in the engine depends on the plugin host.
lumit-core = { path = "../lumit-core" }
# Cancellation epochs and the worker-pool sizing. A render carries an epoch
# token like every other piece of scheduled work (docs/13 §6), and
# `multiThreadNumCPUs` answers with the same sum the evaluation pool uses, so
# the number a plugin sizes its scratch from is the number the host really
# spends. The edge runs one way: `lumit-eval` knows nothing about plugins.
lumit-eval = { path = "../lumit-eval" }
# Lumit's working frames are half floats; the boundary widens them to fp32,
# which is the only depth this host advertises (docs/12 §2.1).
half = "2"
# The multi-thread suite's mutexes are these, and so is the render
# serialisation an unsafe plugin needs.
parking_lot = "0.12"
# The fan-out `multiThread` runs on, on a pool of its own.
rayon = "1"
# The bundle binary is a plain DLL/dylib opened at run time; libloading is the
# portable `LoadLibraryW`/`dlopen` wrapper and is already in the tree.
libloading = "0.8"
# The quirks table is data, not code (docs/12 §2.5), so it is a JSON file the
# crate embeds and parses. The same derives put the control protocol's messages
# on the wire (`ipc::proto`).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# An effect instance is named by a uuid, and a plugin definition keeps one live
# plugin instance per effect instance (K-593).
uuid = { version = "1", features = ["v7"] }
# The control plane: length-prefixed `bincode` over a duplex local socket —
# a named pipe on Windows, a Unix socket elsewhere (docs/impl/ofx-host.md §4).
bincode = "1"
interprocess = "2"
# The frame plane: the shared-memory ring. `memmap2` is `CreateFileMapping` +
# `MapViewOfFile` on Windows and `mmap` on Unix — the two calls the note names,
# spelled once instead of twice.
memmap2 = "0.9"

[build-dependencies]
# The four parameter-suite entry points that are C-variadic in the header are
# written in C (`src/suites/variadic.c`), because Rust cannot define one on
# stable and a fixed-arity stand-in is only right on some ABIs. `cc` is already
# in the lock file through the tree's other dependencies; this is its first use
# in the workspace's own code.
cc = "1"

[dev-dependencies]
# The minimal OFX plugin the host is tested against. It is declared here so a
# plain `cargo test -p lumit-ofx` builds the cdylib the tests dlopen; the
# dependency edge is dev-only, so the cycle (the plugin depends on this crate
# for the C declarations) is the one Cargo permits.
lumit-ofx-testplug = { path = "../lumit-ofx-testplug" }
tempfile = "3"

# The plugin hosts cannot inherit the workspace's `unsafe_code = "deny"`:
# the OFX API is a C ABI of raw pointers and function tables, which is unsafe
# by construction (docs/14 §7 permits it here and requires the SAFETY comments
# and layout tests that go with it). The clippy denies from the workspace are
# kept, so no-panic/no-unwrap discipline still holds.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[lints.rust]
unsafe_code = "allow"
