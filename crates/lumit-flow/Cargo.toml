[package]
name = "lumit-flow"
version.workspace = true
edition = "2021"
license = "GPL-3.0-only"
# Never goes to crates.io: these crates are the application, and they
# reference each other by path (docs/05-ARCHITECTURE.md).
publish = false

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
lumit-gpu = { path = "../lumit-gpu" }
pollster = "0.4"
thiserror = "2"
wgpu = "24"

[lints]
workspace = true

[dev-dependencies]
# The shared test device (`lumit_gpu::test_support`). These tests used to open a
# wgpu device each, in parallel, against one card; the lease is what makes them
# take turns.
lumit-gpu = { path = "../lumit-gpu", features = ["test-fixtures"] }
