[package]
name = "lumit-render"
version.workspace = true
edition = "2021"
license = "GPL-3.0-only"
# Never goes to crates.io: these crates are the application, and they
# reference each other by path (docs/05-ARCHITECTURE.md).
publish = false

# The pixel pass: decode planning, per-layer decoding, draw-list building, GPU
# compositing, the frame-cache tiers, the headless render seam and export. An
# engine crate — it depends on no frontend and knows nothing about egui, Flutter
# or the bridge (docs/05-ARCHITECTURE.md). Both frontends drive it (K-178).
[dependencies]
lumit-core = { path = "../lumit-core" }
lumit-audio = { path = "../lumit-audio" }
lumit-cache = { path = "../lumit-cache" }
lumit-eval = { path = "../lumit-eval" }
lumit-flow = { path = "../lumit-flow" }
lumit-gpu = { path = "../lumit-gpu" }
lumit-media = { path = "../lumit-media" }
lumit-project = { path = "../lumit-project" }
lumit-text = { path = "../lumit-text" }
# The camera tracker (K-415). The analysis job lives here because it is the one
# crate that can both decode a clip and hold the solve where the render path
# reads it (docs/impl/tracking.md §5b).
lumit-track = { path = "../lumit-track" }
# The compositor speaks wgpu directly. The version is pinned to the one
# lumit-gpu links, or the handles would not unify.
wgpu = "24"
# Frame names must mean the same thing next week as today, because the disk
# tier keeps them between sessions — so the Viewer's look is folded into a
# name with the same hash lumit-eval builds the name with, not with a hasher
# whose output may move with the toolchain.
blake3 = "1"
# The `track/` sidecar's body (K-417), in the same form the media index uses for
# the same reason: a compact record of a struct, rebuilt whenever it disagrees.
bincode = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7"] }

[features]
# The Windows zero-copy Viewer path (K-177). Off by default; forwarded from
# whichever frontend builds it (the bridge's shipped `.dll`).
shared-texture = ["lumit-gpu/shared-texture"]
# The Linux DMA-BUF sibling (K-177).
shared-texture-linux = ["lumit-gpu/shared-texture-linux"]
# The macOS IOSurface sibling (K-195).
shared-texture-macos = ["lumit-gpu/shared-texture-macos"]

[dev-dependencies]
lumit-media = { path = "../lumit-media", features = ["test-fixtures"] }
tempfile = "3"

[lints]
workspace = true
